site_name: dshtrading-connector-transaq
site_description: "Пакет @dshtrading/ru: коннектор TRANSAQ для DeepSeek Harness, рынок ru / провайдер finam и read-only инструменты ru_*"
site_url: https://kmlebedev.github.io/dshtrading-connector-transaq/
repo_url: https://github.com/kmlebedev/dshtrading-connector-transaq
repo_name: kmlebedev/dshtrading-connector-transaq
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site
use_directory_urls: false

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Обзор: index.md
  - Происхождение: migration.md
